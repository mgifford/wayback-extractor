[project]
name = "wayback-extractor"
version = "0.1.0"
description = "Mirror Wayback Machine snapshots into static local copies"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "requests",
  "beautifulsoup4",
]

[dependency-groups]
dev = [
  "pytest",
  "flake8",
]

[tool.uv]
default-groups = ["dev"]
